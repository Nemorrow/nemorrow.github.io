{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" type="image/svg+xml" sizes="any" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- end custom head snippets -->

{% if page.page_class == 'quiet-home-page' %}
<script>
(function () {
  var theme;
  try { theme = localStorage.getItem('homepage-theme'); } catch (_) {}
  if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="preload" href="{{ '/assets/images/shiye-name-calligraphy.png' | relative_url }}" as="image" type="image/png">
<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/home-motion.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/assets/js/home.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
<script src="{{ '/assets/js/home-motion.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{% endif %}

{% if site.visitor_analytics.enabled and site.visitor_analytics.script_url != '' and site.visitor_analytics.website_id != '' and jekyll.environment == 'production' %}
<script defer src="{{ site.visitor_analytics.script_url | escape }}" data-website-id="{{ site.visitor_analytics.website_id | escape }}" data-domains="{{ site.visitor_analytics.domains | escape }}" data-do-not-track="true" data-exclude-search="true" data-exclude-hash="true"></script>
{% endif %}
