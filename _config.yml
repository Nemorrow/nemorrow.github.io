# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en_AU"
title                    : "Shiye Lei (雷诗叶)"
title_separator          : "-"
name                     : &name "Shiye"
description              : &description "LLM researcher @ ByteDance"
url                      : https://shiyelei.com
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "nemorrow/nemorrow.github.io"
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  path                   : # blank (default) uses feed.xml

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :  # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Analytics
analytics:
  provider               : false # Umami is configured below; avoid duplicate tracking.
  google:
    tracking_id          :


# Site Author
author:
  name             : "Shiye Lei"
  name_zh          : "雷诗叶"
  avatar           : "profile4.jpg"
  bio              : "Researcher @ ByteDance"
  location         : "Beijing, CN"
  #employer         :
  #pubmed           : "https://www.ncbi.nlm.nih.gov/pubmed/?term=john+snow"
  googlescholar    : "https://scholar.google.com/citations?user=k3-RdRgAAAAJ&hl"
  email            : "leishiye@gmail.com"
  #researchgate     :  # example: "https://www.researchgate.net/profile/yourprofile"
  #uri              :
  #bitbucket        :
  #codepen          :
  #dribbble         :
  #flickr           :
  #facebook         :
  #foursquare       :
  github           : "LeavesLei"
  #google_plus      :
  #keybase          :
  #instagram        :
  #impactstory      : #"https://profiles.impactstory.org/u/xxxx-xxxx-xxxx-xxxx"
  #lastfm           :
  #linkedin         :
  #orcid            : "http://orcid.org/yourorcidurl"
  #pinterest        :
  #soundcloud       :
  #stackoverflow    : # http://stackoverflow.com/users/123456/username
  #steam            :
  #tumblr           :
  #twitter          : "replacethistwitterhandle"
  #vine             :
  #weibo            :
  #xing             :
  #youtube          :
  #wikipedia        :


# Reading Files
include:
  - .htaccess
  - files
exclude:
  # Only index.md and 404.md are public pages. Keep retired sources in the
  # repository without generating their old website URLs.
  - _pages
  # Retired template content must not become public routes or static downloads.
  - _posts
  - _portfolio
  - _publications
  - _talks
  - _teaching
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - markdown_generator
  - CONTRIBUTING.md
  - scripts
  - TOKEN_USAGE.md
  - INTEGRATIONS.md
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  #teaching:
  #  output: true
  #  permalink: /:collection/:path/
  #publications:
  #  output: true
  #  permalink: /:collection/:path/
  #portfolio:
  #  output: true
  #  permalink: /:collection/:path/
  #talks:
  #  output: true
  #  permalink: /:collection/:path/


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Australia/Sydney # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-paginate
  #- jekyll-sitemap
  #- jekyll-gist
  #- jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-redirect-from
  #- jekyll-sitemap
  #- jekyll-gist
  #- jekyll-feed
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

# Optional HTTPS endpoint returning the same schema as assets/data/codex-usage.json.
# Empty means use the bundled snapshot. Never put an account token here.
token_usage:
  endpoint: ""

# Private Umami Cloud dashboard. Only the public tracking ID belongs in the repo.
# Do not enable Share URLs or embed the analytics dashboard on the homepage.
visitor_analytics:
  enabled: true
  script_url: "https://cloud.umami.is/script.js"
  website_id: "2557fd9a-808e-454e-9f0b-b13bae99e5db"
  domains: "shiyelei.com,www.shiyelei.com,nemorrow.github.io"
